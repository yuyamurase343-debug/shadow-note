<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シャドーノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="シャドーノート">
<meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --sheet:#fbfcfd; --rule:#d5e1ea; --rule-strong:#a9c1d3;
  --ink:#1b2a3a; --pencil:#6c7b89; --line:#d9e1e7;
  --red:#d42f27; --red-wash:#fde7e4; --blue:#2558a8; --blue-wash:#e3ecf8; --ok:#2f7a4f;
  --ui:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;
  --en:"Literata",Georgia,serif;
  --pen:"Klee One","Zen Kaku Gothic New",cursive;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a22;--sheet:#18222c;--rule:#26343f;--rule-strong:#35505f;--ink:#e6edf2;--pencil:#93a3b1;--line:#2a3742;
  --red:#ff6a5c;--red-wash:#3a1f1e;--blue:#8db4f0;--blue-wash:#1c2b40;--ok:#6cc790}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(120px + var(--safe-b))}
header.bar{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
header.bar h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{color:inherit;border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--pen);font-size:22px;font-weight:600;letter-spacing:.02em}
.muted{color:var(--pencil)}
.small{font-size:13px}

/* 今日の記録 */
.today{display:flex;gap:20px;align-items:baseline;padding:6px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.today b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.today span{font-size:13px;color:var(--pencil);margin-left:4px}

/* 教材リスト */
.list{display:flex;flex-direction:column}
.mat{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 2px}
.mat:active{background:var(--line)}
.mat .t{font-weight:700;display:flex;gap:8px;align-items:baseline}
.mat .t .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat .p{font-family:var(--en);color:var(--pencil);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.score-tag{font-family:var(--pen);font-size:17px;color:var(--red);font-weight:600}
.empty{padding:40px 8px;text-align:center;color:var(--pencil)}
.empty p{margin:0 0 16px}

/* ボタン */
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0e1620}}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* フォーム */
label.f{display:block;margin:0 0 16px}
label.f > span{display:block;font-size:13px;color:var(--pencil);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px;font-size:16px}
textarea.inp{min-height:220px;font-family:var(--en);line-height:1.7;resize:vertical}
.filebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filebox .name{font-size:14px;color:var(--pencil);flex:1;min-width:0;overflow-wrap:anywhere}

/* プレーヤー */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:4px 0 10px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:currentColor}
.seek{width:100%;accent-color:var(--blue)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--pencil);min-width:76px;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.seg button{border:0;background:transparent;padding:10px 2px;font-size:13px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--blue-wash);color:var(--blue);font-weight:700}
.mode-hint{font-size:13px;color:var(--pencil);margin:-6px 2px 12px}

/* ノート（スクリプト面）—— このアプリの主役 */
.note{background:var(--sheet);border-radius:4px;border:1px solid var(--line);position:relative;
  padding:14px 16px 18px 30px;
  background-image:linear-gradient(to right,transparent 18px,var(--red-wash) 18px,var(--red-wash) 19px,transparent 19px),
  repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--rule) 43px,var(--rule) 44px);
  background-position:0 0,0 10px}
.note-head{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.note-head h2{font-size:15px;margin:0;flex:1}
.script{font-family:var(--en);font-size:19px;line-height:44px;word-break:normal;overflow-wrap:anywhere}
.script.hidden .w{color:transparent;background:var(--line);border-radius:3px}
.g{display:inline;position:relative;cursor:pointer;border-radius:3px;padding:0 1px}
.g:active{background:var(--blue-wash)}
.w.bad{color:var(--red);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:5px}
.w.miss{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.g.has-bad{background:var(--red-wash)}
.script.guide{line-height:30px}
.script.guide .g{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2px 10px 0;padding:2px 3px 0}
.script.guide .g .ws{white-space:nowrap}
.kana{font-family:var(--pen);font-size:13px;line-height:16px;color:var(--blue);font-weight:600;white-space:nowrap}
.g.has-bad .kana{color:var(--red)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--pencil);margin:10px 2px 0;flex-wrap:wrap}
.legend i{font-style:normal;color:var(--red);font-family:var(--en)}

/* 録音バー */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + var(--safe-b));z-index:8}
.dock-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.rec{width:68px;height:68px;border-radius:50%;border:4px solid var(--sheet);background:var(--red);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.rec span{width:24px;height:24px;border-radius:50%;background:#fff;transition:border-radius .2s,width .2s,height .2s}
.rec.on span{border-radius:5px;width:22px;height:22px}
.rec.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--red-wash)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.dock-text{flex:1;min-width:0}
.dock-text b{display:block;font-size:15px}
.dock-text small{color:var(--pencil);font-size:12px}

/* 結果 */
.result-top{display:flex;align-items:center;gap:18px;margin:6px 0 4px}
.big-score{font-family:var(--pen);font-size:64px;line-height:1;color:var(--red);font-weight:600;position:relative;padding:6px 14px 6px 8px}
.big-score::after{content:"";position:absolute;inset:-4px -6px -2px -10px;border:2.5px solid var(--red);border-radius:52% 48% 55% 45%/50% 55% 45% 50%;transform:rotate(-6deg);opacity:.85}
.big-score small{font-size:22px}
.result-sum{font-size:14px;color:var(--pencil)}
.result-sum b{color:var(--ink)}
.waiting{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px;text-align:center}
.bar-prog{width:100%;max-width:280px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
details.heard{margin-top:14px;font-size:14px}
details.heard summary{color:var(--pencil);cursor:pointer;padding:6px 0}
details.heard p{font-family:var(--en);margin:6px 0 0}

/* 履歴 */
.hist{margin-top:6px}
.hist button{display:flex;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 2px;align-items:baseline;gap:10px;text-align:left}
.hist .d{flex:1;font-size:14px}
.hist .m{font-size:12px;color:var(--pencil)}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  background:var(--sheet);border-radius:16px 16px 0 0;max-height:82vh;overflow:auto;padding:10px 20px calc(24px + var(--safe-b))}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet-in{max-width:600px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sh-words{font-family:var(--en);font-size:26px;font-weight:600;margin:0 0 4px}
.sh-verdict{color:var(--red);font-size:14px;margin:0 0 16px}
.compare{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;margin:0 0 16px}
.compare dt{font-size:13px;color:var(--pencil)}
.compare dd{margin:0}
.naive{font-size:17px;color:var(--pencil);text-decoration:line-through;text-decoration-color:var(--red)}
.natural{font-family:var(--pen);font-size:30px;color:var(--red);font-weight:600;line-height:1.3}
.tips{margin:0 0 18px;padding:0;list-style:none;border-top:1px solid var(--line)}
.tips li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap}

.section-title{font-size:15px;font-weight:700;margin:26px 0 6px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row > div{flex:1}
.set-row small{display:block;color:var(--pencil);font-size:12px;line-height:1.5}
.switch{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--blue)}
.switch:checked::after{transform:translateX(18px)}
.radio-list label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.radio-list input{margin-top:5px;accent-color:var(--blue)}
.radio-list small{display:block;color:var(--pencil);font-size:12px}
/* パート一覧 */
.part .pnum{font-family:var(--pen);font-size:20px;font-weight:600;color:var(--blue);min-width:28px}
textarea.inp.ja{min-height:120px;font-family:var(--ui)}

/* パート練習画面（プレーヤー） */
body.player-page{background:var(--sheet)}
body.player-page .wrap{max-width:none;padding:0}
.pbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--sheet);border-bottom:1px solid var(--line)}
.ptitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ptitle b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--pencil)}
.pnav{border:0;background:transparent;width:26px;height:24px;display:grid;place-items:center;border-radius:6px;color:inherit;padding:0}
.pnav:disabled{opacity:.25}
.pnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:8px;height:34px;min-width:44px;padding:0 8px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tbtn[aria-pressed=true]{background:var(--blue-wash);border-color:var(--blue);color:var(--blue)}
.pscroll{max-width:640px;margin:0 auto;padding:22px 22px calc(250px + var(--safe-b))}
.script.big{font-size:22px;line-height:1.85}
.script.big.guide{line-height:30px}
.ja-text{font-size:18px;line-height:1.95}
.hidden-msg{color:var(--pencil);padding:40px 0;text-align:center;font-size:15px}
.pdock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--sheet);border-top:1px solid var(--line);padding:12px 18px calc(10px + var(--safe-b))}
.pdock > *{max-width:600px;margin-left:auto;margin-right:auto}
.modes{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:12px}
.modes button{border:0;background:transparent;border-radius:999px;padding:9px 0;font-weight:700;font-size:15px;color:var(--pencil)}
.modes button[aria-pressed=true]{background:var(--blue);color:#fff}
.modes button[data-m=record][aria-pressed=true]{background:var(--red)}
@media (prefers-color-scheme:dark){.modes button[aria-pressed=true]{color:#0e1620}}
.seekrow{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--pencil)}
.seekrow span{min-width:40px}
.seekrow span:last-child{text-align:right}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 2px}
.ctl{border:0;background:transparent;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ctl:disabled{opacity:.3}
.ctl svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl.txt{font-weight:700;font-size:15px;border:2px solid var(--line);width:50px;height:38px;border-radius:9px}
.ctl.txt.on{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}
.main-btn{width:74px;height:74px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center}
.main-btn svg{width:30px;height:30px}
.main-btn svg.fill{fill:currentColor;stroke:none}
.main-btn.rec{background:var(--red);box-shadow:0 0 0 4px var(--red-wash)}
.main-btn.rec span{width:26px;height:26px;border-radius:50%;background:#fff;transition:border-radius .2s}
.main-btn.rec.on span{border-radius:5px;width:24px;height:24px}
.main-btn.rec.on{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-color-scheme:dark){.main-btn{color:#0e1620}.main-btn.rec span{background:#0e1620}}
.dock-note{font-size:12px;color:var(--pencil);text-align:center;margin:4px auto 0;min-height:18px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
